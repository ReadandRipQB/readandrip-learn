title: Read & Rip Football IQ
tagline: See it before the snap.
description: >-
  Football IQ, taught on a whiteboard. Coverages, fronts, gaps and pre-snap reads
  explained plainly for players, parents and coaches, from the creator of the Read & Rip app.
author: Zach Trainor
url: "https://learn.readandrip.com"
baseurl: ""
app_url: "https://readripqb.com"
home_url: "https://readandrip.com"
lang: en-US
logo: /assets/apple-touch-icon.png
social:
  name: Read & Rip
  links:
    - https://readandrip.com
    - https://readripqb.com
twitter:
  card: summary_large_image

permalink: /:title/
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /assets/og-image.jpg

exclude:
  - README.md
  - CLAUDE.md
  - .gitignore
  - TOPIC_MAP.md
