# Tells Bing and the other IndexNow search engines about this site's pages
# right after a merge to main, so new and changed pages get crawled fast.
# Google doesn't use IndexNow; it reads the sitemap in Search Console.
name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Send sitemap URLs to IndexNow
        env:
          HOST: learn.readandrip.com
          KEY: 168cfa0df39be3cd38646ac3fa92e07b
        run: |
          set -euo pipefail
          curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' > urls.txt
          echo "Submitting $(wc -l < urls.txt) URLs"
          python3 - <<'PY'
          import json, os
          urls = [u.strip() for u in open("urls.txt") if u.strip()]
          host, key = os.environ["HOST"], os.environ["KEY"]
          body = {"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}
          open("body.json", "w").write(json.dumps(body))
          PY
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow answered $code"; cat resp.txt || true
          case "$code" in 200|202) ;; *) exit 1 ;; esac
